[project]
name = "stard"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.mypy.overrides]]
module = "serial.*"
ignore_missing_imports = true